[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lqtpy"
dynamic = ["version"]
description = "Fast lesion morphometry, atlas overlap, quality checks and plain-language descriptions, with self-contained HTML reports."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "neuroimaging", "lesion", "morphometry", "disconnection", "tractography",
    "atlas", "NIfTI", "clinical-research",
]
authors = [
    { name = "Lcutiepie contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# No `[project.urls]` table yet: the repository has not been pushed anywhere,
# so there is no homepage/issues URL to publish and a placeholder would be a
# broken link. Add one when it exists.

# Core stays numpy/scipy/nibabel only: morphometry, atlas overlap, QC,
# descriptions and the built-in shape extra need nothing else, and
# `import lqtpy` imports none of pandas/matplotlib/nilearn (enforced by
# tests/test_import_hygiene.py). Figures and HTML reports are opt-in extras.
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
]

[project.optional-dependencies]
# Reports need nothing extra: figures are drawn with numpy. nilearn supplies
# the slice viewer's script and ggseg the subcortical map geometry; without
# them those two parts are simply left out.
report = ["nilearn", "ggseg"]
tables = ["pandas"]
plots = ["matplotlib", "nilearn", "pandas", "ggseg"]   # the old matplotlib figure helpers
ggseg = ["pandas", "matplotlib"]
formats = ["highdicom"]          # DICOM-SEG input (NRRD and MGZ need nothing)
pdf = ["pypdf"]                  # merged group PDF bundle
discon = []  # tract_disconnection() needs no extra packages at runtime, only
             # a locally-built index -- see tools/build_discon_index.py.
all = ["pandas", "matplotlib", "nilearn", "ggseg", "pypdf"]
dev = ["pandas", "matplotlib", "nilearn", "ggseg", "pytest", "dipy", "pypdf", "pillow"]

[project.scripts]
lqtpy = "lqtpy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "lqtpy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["lqtpy"]

# THE SINGLE MOST IMPORTANT LINE IN THIS FILE.
# Hatchling builds its file list from VCS (git ls-files) by default. .gitignore
# blanket-excludes `*.nii*` to keep patient scans out of git, and the bundled
# atlas volumes under lqtpy/data/atlases/ are *.nii.gz -- so without this
# explicit `artifacts` entry, hatchling's VCS-based file list silently drops
# them and the built wheel ships with zero atlases. lqtpy would install fine
# and then raise FileNotFoundError the moment anyone loads an atlas. Do not
# remove this line, and if the atlases directory moves, update the glob.
artifacts = ["lqtpy/data/**"]
